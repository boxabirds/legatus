[package]
name = "legatus-proxy"
description = "The Legatus model-port reverse proxy"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "legatus_proxy"
path = "src/lib.rs"

[[bin]]
name = "legatus"
path = "src/main.rs"

[features]
# Test-only hook: a check that raises one warning when LEGATUS_TEST_WARNING_PATH is set.
# Never enabled in a release build.
test-hooks = []

[dependencies]
legatus-common.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "sync"] }
hyper = { workspace = true, features = ["http1", "client", "server"] }
hyper-util = { workspace = true, features = ["tokio", "client-legacy", "http1", "server", "service"] }
axum = { workspace = true, features = ["http1", "tokio"] }
yaml_serde.workspace = true
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
serde_json = "1"
