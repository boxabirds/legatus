[package]
name = "legatus-testkit"
description = "Stub nodes, captures and invariants shared by the simulation tests"
edition.workspace = true
version.workspace = true
publish.workspace = true

[dependencies]
legatus-common.workspace = true
legatus-proxy.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time", "sync", "io-util", "test-util", "net"] }
hyper = { workspace = true, features = ["http1", "client", "server"] }
hyper-util = { workspace = true, features = ["tokio", "http1", "server", "service", "client-legacy"] }
axum = { workspace = true, features = ["http1", "tokio"] }
tower = { workspace = true }
async-trait = "0.1"
bytes = "1"
futures-util = "0.3"
http = "1"
http-body-util = "0.1"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hmac = "0.12"
sha2 = "0.10"

[[bin]]
name = "legatus-stub"
path = "src/bin/stub.rs"

[[bin]]
name = "legatus-capture"
path = "src/bin/capture.rs"